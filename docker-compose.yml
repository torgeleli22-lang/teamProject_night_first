# EC2 한 대에서 API + Caddy(HTTPS 자동 발급)를 함께 띄운다. 순서: docs/DEPLOY_AWS.md
#   sudo docker build -t codereading-api .
#   sudo docker compose up -d
services:
  api:
    image: codereading-api
    build: .
    restart: unless-stopped
    env_file: .env          # DB_DRIVER, DATABASE_URL, AI_MODE, ADMIN_TOKEN, ALLOWED_ORIGINS …
    expose:
      - "8787"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 예: SITE_ADDRESS=43-201-12-34.sslip.io  (공인 IP 의 점을 - 로 바꾼 무료 도메인 → HTTPS 인증서 자동 발급)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
