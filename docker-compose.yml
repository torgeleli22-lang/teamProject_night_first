# EC2 한 대에서 앱 + Caddy(웹 서버, 도메인 연결 시 HTTPS 자동 발급)를 함께 띄운다
#   docker build -t codereading-app .   # 앱 이미지 만들기 (코드가 바뀔 때마다)
#   docker compose up -d                # 실행 / 새 이미지로 교체
# 자세한 순서: docs/DEPLOY_AWS.md
services:
  app:
    image: codereading-app
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - app-data:/app/data   # SQLite 파일은 컨테이너를 다시 만들어도 남는다
    expose:
      - "3000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 도메인이 없으면 :80 (http://공인IP), 도메인이 생기면 .env 에 SITE_ADDRESS=example.com
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
