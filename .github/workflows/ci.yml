# 자동 검사 (push · PR 마다): 타입 · 테스트(TS + Python) · 예시 코드 실행 검증 · Lambda 전체 흐름 · 정적 빌드
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Python Lambda 를 실행하려면 Python + boto3 (AWS Lambda Python 3.13 런타임과 같은 버전)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
      - name: Lambda 전체 흐름 (로컬 DynamoDB 흉내 서버 + 목업 AI)
        run: npm run smoke
      - run: npm run build
