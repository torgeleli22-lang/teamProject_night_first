# 자동 검사 (push · PR 마다): 타입 · 테스트 · 콘텐츠 실행 검증 · API 전체 흐름(SQLite, PostgreSQL) · 정적 빌드 · Lambda 패키지
# 끝나면 Lambda 에 올릴 lambda.zip 을 Actions 실행 화면의 Artifacts 에서 받을 수 있다.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_MODE: mock
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobase
          DATA_API_RETRY_MS: "10"
      - run: npm run verify
      - name: API 흐름 (SQLite)
        run: npm run smoke
        env:
          DATABASE_PATH: ${{ runner.temp }}/smoke.db
      - name: API 흐름 (PostgreSQL)
        run: npm run smoke
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobase
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:lambda
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: dist/lambda.zip
          retention-days: 30
